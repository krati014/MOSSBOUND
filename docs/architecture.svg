<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1ff2d1"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9e2e"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#05090f"/>
  <text x="40" y="52" fill="#e0f2ee" font-size="26" font-weight="700" letter-spacing="3">MOSSBOUND · SYSTEM ARCHITECTURE</text>
  <text x="40" y="78" fill="#7f9ea3" font-size="14">Player words → VLM planner → validated skills → GO_TO vision loop (VLM grounding → 3D goal → A*) → sensor-checked arrival → or ask for help.</text>

  <!-- Unity -->
  <rect x="40" y="110" width="500" height="480" rx="18" fill="#0a1820" stroke="#1ff2d1" stroke-opacity=".35"/>
  <text x="64" y="144" fill="#1ff2d1" font-size="15" font-weight="700" letter-spacing="2">UNITY 6 · URP · C#</text>
  <g font-size="13" fill="#e0f2ee">
    <rect x="64" y="164" width="210" height="58" rx="10" fill="#11252e"/><text x="80" y="188" font-weight="700">UIController · QuestManager</text><text x="80" y="207" fill="#7f9ea3">game HUD · missions · help card</text>
    <rect x="306" y="164" width="210" height="58" rx="10" fill="#11252e"/><text x="322" y="188" font-weight="700">Environment · DayNight</text><text x="322" y="207" fill="#7f9ea3">procedural garden · day ↔ night</text>
    <rect x="64" y="252" width="452" height="70" rx="10" fill="#1a1530" stroke="#9a5cff" stroke-opacity=".6"/><text x="80" y="278" font-weight="700">CommandExecutor  (plan → skills → GO_TO loop)</text><text x="80" y="300" fill="#b9a6ff">/plan once · per GO_TO: 4 views → /act → bbox→3D → A* → verify · help</text>
    <rect x="64" y="352" width="210" height="58" rx="10" fill="#11252e"/><text x="80" y="376" font-weight="700">CameraCapture (360°)</text><text x="80" y="395" fill="#7f9ea3">4 views → JPEG</text>
    <rect x="306" y="352" width="210" height="58" rx="10" fill="#11252e"/><text x="322" y="376" font-weight="700">VLMClient</text><text x="322" y="395" fill="#7f9ea3">HTTP/JSON · /plan · /act · /health</text>
    <rect x="64" y="440" width="210" height="58" rx="10" fill="#11252e"/><text x="80" y="464" font-weight="700">TargetLocator + NavGrid</text><text x="80" y="483" fill="#7f9ea3">bbox→3D goal · A* · RoverController</text>
    <rect x="306" y="440" width="210" height="58" rx="10" fill="#11252e"/><text x="322" y="464" font-weight="700">CommandParser</text><text x="322" y="483" fill="#7f9ea3">re-validates plans + commands</text>
    <text x="64" y="540" fill="#7f9ea3">Player can drive (WASD) at any time — the AI plan pauses. Proximity sensor</text>
    <text x="64" y="558" fill="#7f9ea3">confirms arrival only — never used for steering.</text>
  </g>
  <path d="M169 222 V252" stroke="#1ff2d1" stroke-width="2" marker-end="url(#a)"/>
  <path d="M169 322 V352" stroke="#1ff2d1" stroke-width="2" marker-end="url(#a)"/>
  <path d="M274 381 H306" stroke="#1ff2d1" stroke-width="2" marker-end="url(#a)"/>
  <path d="M411 410 V440" stroke="#ff9e2e" stroke-width="2" marker-end="url(#b)"/>
  <path d="M306 469 H274" stroke="#ff9e2e" stroke-width="2" marker-end="url(#b)"/>

  <!-- Backend -->
  <rect x="640" y="110" width="240" height="480" rx="18" fill="#0a1820" stroke="#ff9e2e" stroke-opacity=".45"/>
  <text x="664" y="144" fill="#ff9e2e" font-size="15" font-weight="700" letter-spacing="2">PYTHON · FASTAPI</text>
  <g font-size="13" fill="#e0f2ee">
    <rect x="660" y="166" width="200" height="74" rx="10" fill="#1f1a10"/><text x="676" y="190" font-weight="700">server.py  :8765</text><text x="676" y="209" fill="#c9b08a">POST /plan · /act · /health</text><text x="676" y="227" fill="#c9b08a">logs frames + replies</text>
    <rect x="660" y="262" width="200" height="74" rx="10" fill="#1f1a10"/><text x="676" y="286" font-weight="700">vlm.py</text><text x="676" y="305" fill="#c9b08a">planner · grounding-first</text><text x="676" y="323" fill="#c9b08a">JSON-schema decoding</text>
    <rect x="660" y="358" width="200" height="110" rx="10" fill="#1f1a10"/><text x="676" y="382" font-weight="700">plan_parser · command_parser</text><text x="676" y="401" fill="#c9b08a">skill whitelist · bbox → bearing</text><text x="676" y="419" fill="#c9b08a">action whitelist · clamps</text><text x="676" y="437" fill="#c9b08a">obstacle / arrival rules</text><text x="676" y="455" fill="#c9b08a">step budget</text>
    <rect x="660" y="490" width="200" height="74" rx="10" fill="#1f1a10"/><text x="676" y="514" font-weight="700">schema.py · prompts.py</text><text x="676" y="533" fill="#c9b08a">pydantic contracts</text><text x="676" y="551" fill="#c9b08a">garden guide · prompts</text>
  </g>

  <!-- Ollama -->
  <rect x="960" y="210" width="200" height="200" rx="18" fill="#140f24" stroke="#9a5cff" stroke-opacity=".7"/>
  <text x="984" y="244" fill="#b9a6ff" font-size="15" font-weight="700" letter-spacing="2">OLLAMA (local GPU)</text>
  <text x="984" y="280" fill="#e0f2ee" font-size="18" font-weight="700">Qwen2.5-VL 7B</text>
  <text x="984" y="304" fill="#b9a6ff" font-size="13">vision-language model</text>
  <text x="984" y="334" fill="#7f9ea3" font-size="12">0) plan from words + 360°</text>
  <text x="984" y="352" fill="#7f9ea3" font-size="12">1) ground goal (bbox_2d)  2) search</text>
  <text x="984" y="378" fill="#7f9ea3" font-size="12">out: understanding, skills,</text>
  <text x="984" y="396" fill="#7f9ea3" font-size="12">bbox_2d, action, status</text>

  <!-- wires -->
  <path d="M516 372 C580 372 590 200 660 200" stroke="#1ff2d1" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="548" y="262" fill="#1ff2d1" font-size="12" transform="rotate(-62 548 262)">views + words</text>
  <path d="M860 290 H960" stroke="#1ff2d1" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M960 340 C915 340 905 400 860 400" stroke="#ff9e2e" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
  <text x="886" y="282" fill="#7f9ea3" font-size="11">/api/chat</text>
  <path d="M660 420 C600 420 590 395 516 395" stroke="#ff9e2e" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
  <text x="548" y="440" fill="#ff9e2e" font-size="12">validated plan / command</text>
</svg>
